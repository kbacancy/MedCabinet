<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <clipPath id="roundedBg">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="#1D9E75"/>

  <!-- Decorative blobs -->
  <circle cx="950" cy="80" r="360" fill="#166B50" opacity="0.28" clip-path="url(#roundedBg)"/>
  <circle cx="90" cy="940" r="260" fill="#166B50" opacity="0.20" clip-path="url(#roundedBg)"/>

  <!-- White card -->
  <rect x="202" y="202" width="620" height="620" rx="126" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- Medical cross — vertical bar -->
  <rect x="472" y="352" width="80" height="320" rx="40" fill="#1D9E75"/>

  <!-- Medical cross — horizontal bar -->
  <rect x="352" y="472" width="320" height="80" rx="40" fill="#1D9E75"/>

  <!-- Pill decorations (bottom of card) -->
  <rect x="270" y="718" width="152" height="56" rx="28" fill="#E8F5F0"/>
  <rect x="602" y="718" width="152" height="56" rx="28" fill="#E8F5F0"/>
</svg>
